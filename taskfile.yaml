version: "3"

vars:
  PROJECT_NAME: "krohnkite"
  PROJECT_VER:
    sh: "git describe --tags --abbrev=0 || echo ''"
  PROJECT_REV:
    sh: "git rev-parse --short HEAD | cut -b-7"
  KWINPKG_FILE_EXT: "kwinscript"

  GIT_BRANCH:
    sh: 'gb=$(git symbolic-ref --short -q HEAD); case "$gb" in master|main) echo "-git" ;; release|release/*) echo "" ;; *) echo "-$(printf "%s" "$gb" | tr "/" "_")" ;; esac'
  KWINPKG_FILE: "{{.PROJECT_NAME }}-{{.PROJECT_VER }}{{.GIT_BRANCH}}_{{.PROJECT_REV }}.{{.KWINPKG_FILE_EXT}}"
  PACKAGE: "builds/{{.KWINPKG_FILE}}"
  KWINPKG_DIR: "pkg"
  LOCALE_DIR: "./translations/locale"

  KWIN_META: "{{.KWINPKG_DIR}}/metadata.json"
  KWIN_QML: "{{.KWINPKG_DIR}}/contents/ui/main.qml"
  NODE_SCRIPT: "{{.PROJECT_NAME}}.js"

  SRC:
    sh: 'find src -name "*.ts"'

tasks:
  clean:
    cmds:
      - rm -rvf {{.KWINPKG_DIR}}
      - rm -vf {{.NODE_SCRIPT}} package-lock.json

  install:
    desc: Build and install the package, then refresh its icons
    deps: [kwin-pkg-file]
    cmds:
      - "kpackagetool6 -t KWin/Script -s {{.PROJECT_NAME}} && kpackagetool6 -t KWin/Script -u {{.PACKAGE}} || kpackagetool6 -t KWin/Script -i {{.PACKAGE}}"
      - python3 tools/install-icons.py

  reload:
    desc: Build, install and reload without logging out
    deps: [install]
    cmds:
      - python3 tools/reload-script.py {{.KWINPKG_DIR}}

  reload-file:
    desc: Reload a prebuilt .kwinscript file without rebuilding
    cmds:
      - python3 tools/reload-script.py {{.CLI_ARGS}}

  uninstall:
    cmds:
      - "kpackagetool6 -t KWin/Script -r  {{.PROJECT_NAME}}"
      - python3 tools/install-icons.py --uninstall

  test:
    desc: Run the type check and the test suite
    deps: [install-deps]
    cmds:
      - npm run check

  kwin-pkg-file:
    desc: Build the .kwinscript package into builds/
    aliases: [package]
    deps:
      - kwin-pkg
    cmds:
      - mkdir -p builds
      - "rm -f {{.PACKAGE}}"
      - "7z a -tzip {{.PACKAGE}} ./{{.KWINPKG_DIR}}/*"
    sources:
      - "{{.KWINPKG_DIR}}/**/*"
    generates:
      - "{{.PACKAGE}}"

  kwin-pkg:
    deps: [build-ts]
    cmds:
      - mkdir -p {{.KWINPKG_DIR}}/contents/ui
      - mkdir -p {{.KWINPKG_DIR}}/contents/code
      - mkdir -p {{.KWINPKG_DIR}}/contents/config
      - task: meta-version
      - cp res/main.qml {{.KWINPKG_DIR}}/contents/ui/main.qml
      - cp res/config.ui {{.KWINPKG_DIR}}/contents/ui/config.ui
      - cp res/popup.qml  {{.KWINPKG_DIR}}/contents/ui/popup.qml
      - cp res/layoutchooser.qml {{.KWINPKG_DIR}}/contents/ui/layoutchooser.qml
      - cp res/iconinstaller.qml {{.KWINPKG_DIR}}/contents/ui/iconinstaller.qml
      - cp -r res/layouts {{.KWINPKG_DIR}}/contents/ui/
      - cp -r res/appicon {{.KWINPKG_DIR}}/contents/ui/
      - cp tools/install-icons.py {{.KWINPKG_DIR}}/contents/code/install-icons.py
      - cp tools/collect-diagnostics.py {{.KWINPKG_DIR}}/contents/code/collect-diagnostics.py
      - cp res/dragpreview.qml  {{.KWINPKG_DIR}}/contents/ui/dragpreview.qml
      - cp res/droppreview.qml  {{.KWINPKG_DIR}}/contents/ui/droppreview.qml
      - cp res/droppreview-window.qml  {{.KWINPKG_DIR}}/contents/ui/droppreview-window.qml
      - cp res/shellrunner.qml  {{.KWINPKG_DIR}}/contents/ui/shellrunner.qml
      - cp res/shortcuts.qml  {{.KWINPKG_DIR}}/contents/ui/shortcuts.qml
      - cp res/dbus.qml  {{.KWINPKG_DIR}}/contents/ui/dbus.qml
      - cp {{.NODE_SCRIPT}} {{.KWINPKG_DIR}}/contents/code/script.js
      - cp res/main.js   {{.KWINPKG_DIR}}/contents/code/main.js
      - cp res/config.xml  {{.KWINPKG_DIR}}/contents/config/main.xml
      - cp -r {{.LOCALE_DIR}} {{.KWINPKG_DIR}}/contents/
    sources:
      - res/main.qml
      - res/config.ui
      - res/popup.qml
      - res/layoutchooser.qml
      - res/iconinstaller.qml
      - res/layouts/*.svg
      - res/appicon/*.svg
      - tools/install-icons.py
      - tools/collect-diagnostics.py
      - res/dragpreview.qml
      - res/droppreview.qml
      - res/droppreview-window.qml
      - res/shellrunner.qml
      - res/shortcuts.qml
      - res/dbus.qml
      - "{{.NODE_SCRIPT}}"
      - res/main.js
      - res/config.xml
    generates:
      - "{{.KWINPKG_DIR}}/contents/ui/main.qml"
      - "{{.KWINPKG_DIR}}/contents/ui/config.ui"
      - "{{.KWINPKG_DIR}}/contents/ui/popup.qml"
      - "{{.KWINPKG_DIR}}/contents/ui/layoutchooser.qml"
      - "{{.KWINPKG_DIR}}/contents/ui/iconinstaller.qml"
      - "{{.KWINPKG_DIR}}/contents/ui/layouts/*.svg"
      - "{{.KWINPKG_DIR}}/contents/ui/appicon/*.svg"
      - "{{.KWINPKG_DIR}}/contents/code/install-icons.py"
      - "{{.KWINPKG_DIR}}/contents/code/collect-diagnostics.py"
      - "{{.KWINPKG_DIR}}/contents/ui/dragpreview.qml"
      - "{{.KWINPKG_DIR}}/contents/ui/droppreview.qml"
      - "{{.KWINPKG_DIR}}/contents/ui/droppreview-window.qml"
      - "{{.KWINPKG_DIR}}/contents/ui/shellrunner.qml"
      - "{{.KWINPKG_DIR}}/contents/ui/shortcuts.qml"
      - "{{.KWINPKG_DIR}}/contents/ui/dbus.qml"
      - "{{.KWINPKG_DIR}}/contents/code/script.js"
      - "{{.KWINPKG_DIR}}/contents/code/main.js"
      - "{{.KWINPKG_DIR}}/contents/config/config.xml"

  meta-version:
    cmds:
      - "touch {{.KWIN_META}}"
      - 'sed "s/\$VER/{{.PROJECT_VER}}/" res/metadata.json | sed "s/\$REV/{{.PROJECT_REV}}/" > {{.KWIN_META}}'

  build-ts:
    deps:
      - install-deps
    cmds:
      - npm run tsc --
    sources:
      - src/**/*.ts
    preconditions:
      - test -d src
      - test -n "{{.SRC}}" || (echo "no files found in src folder" && exit 1)
    generates:
      - "{{.NODE_SCRIPT}}"

  install-deps:
    if: "[ ! -f nodeps.bak ]"
    run: once
    cmds:
      - npm install --save-dev
    preconditions:
      - test -f package.json

  package-json:
    cmds:
      - 'sed -i "s/\"version\": [^,]*/\"version\": \"{{.PROJECT_VER}}\"/" package.json'
    preconditions:
      - test -f package.json

  translations:
    desc: Regenerate the translation template and compile the .mo files
    cmds:
      - bash tools/update-translations.sh
